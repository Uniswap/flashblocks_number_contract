[profile.default]
src = "src"
libs = ["lib"]
out = 'out'
solc_version = '0.8.28'
optimizer_runs = 44444444
via_ir = true
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
evm_version = "prague"
gas_limit = "3000000000"
bytecode_hash = "none"

[etherscan]
unichain-sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=1301" }

[rpc_endpoints]
sepolia = "${RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
